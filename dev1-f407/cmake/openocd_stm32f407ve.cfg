# OpenOCD configuration for the custom STM32F407VET6 board.
#
# The debug probe can be either a Keil ULINK2 (CMSIS-DAP) or an ST-Link V2.
# Set OPENOCD_INTERFACE to choose:
#   -DOPENOCD_INTERFACE=cmsis-dap   (default; Keil ULINK2)
#   -DOPENOCD_INTERFACE=stlink      (ST-Link V2)
#
# Usage:
#   openocd -f cmake/openocd_stm32f407ve.cfg -c "program app.hex verify reset exit"
#   openocd -f cmake/openocd_stm32f407ve.cfg        # interactive; telnet 4444

if { [info exists OPENOCD_INTERFACE] } {
    source [find interface/${OPENOCD_INTERFACE}.cfg]
} else {
    source [find interface/cmsis-dap.cfg]
}

# SWD transport. The ST-Link V2 (HLA driver) uses hla_swd; CMSIS-DAP uses swd.
if { [info exists OPENOCD_INTERFACE] && [string equal ${OPENOCD_INTERFACE} "stlink"] } {
    transport select hla_swd
} else {
    transport select swd
}

# Work-area in RAM used for flash programming (STM32F407VET6: 128 KB SRAM).
set WORKAREASIZE 0x20000
# Let OpenOCD auto-detect the CPU IDCODE instead of pinning one revision.
set CPUTAPID 0

source [find target/stm32f4x.cfg]

# stm32f2x flash driver auto-detects the 512 KB bank size from the chip.
adapter speed 4000
