# OpenOCD configuration for the custom STM32F407VET6 board, debugged through
# a Keil ULINK2 (CMSIS-DAP) over SWD.
#
# Usage:
#   openocd -f cmake/openocd_stm32f407ve.cfg -c "program app.hex verify reset exit"
#   openocd -f cmake/openocd_stm32f407ve.cfg        # interactive; telnet 4444

source [find interface/cmsis-dap.cfg]

# SWD transport (SWO/TRACESWO = PE2 on pin 13 of a standard 20-pin header).
transport select swd

# Work-area in RAM used for flash programming (STM32F407VET6: 128 KB SRAM).
set WORKAREASIZE 0x20000
# Let OpenOCD auto-detect the CPU IDCODE instead of pinning one revision.
set CPUTAPID 0

source [find target/stm32f4x.cfg]

# stm32f2x flash driver auto-detects the 512 KB bank size from the chip.
adapter speed 4000
